<svg viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="moon" cx="62%" cy="32%" r="42%">
      <stop offset="0%" stop-color="#fff6d8" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#ffe9a8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffef2"/>
      <stop offset="100%" stop-color="#f3e6b8"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#04050a"/>
      <stop offset="60%" stop-color="#080a14"/>
      <stop offset="100%" stop-color="#0c0f1a"/>
    </linearGradient>
    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2233" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1a2233" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <rect width="900" height="320" fill="url(#sky)"/>

  <!-- moon + halo -->
  <circle cx="560" cy="105" r="230" fill="url(#moon)">
    <animate attributeName="opacity" values="0;0.9;0.9" keyTimes="0;0.18;1" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="560" cy="105" r="70" fill="url(#moonCore)">
    <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.15;1" dur="9s" repeatCount="indefinite"/>
  </circle>

  <!-- distant skyline -->
  <g fill="#0a0c15" opacity="0.95">
    <rect x="0"   y="230" width="55" height="90"/>
    <rect x="55"  y="205" width="35" height="115"/>
    <rect x="95"  y="245" width="60" height="75"/>
    <rect x="700" y="220" width="45" height="100"/>
    <rect x="748" y="250" width="55" height="70"/>
    <rect x="806" y="200" width="38" height="120"/>
    <rect x="848" y="235" width="52" height="85"/>
  </g>
  <rect x="0" y="200" width="900" height="120" fill="url(#fog)"/>

  <!-- drifting particles -->
  <g fill="#c9d6ff">
    <circle cx="120" cy="70" r="1.3"><animate attributeName="opacity" values="0;0.7;0" dur="5s" repeatCount="indefinite" begin="0.2s"/></circle>
    <circle cx="260" cy="45" r="1"><animate attributeName="opacity" values="0;0.6;0" dur="6s" repeatCount="indefinite" begin="1.4s"/></circle>
    <circle cx="700" cy="60" r="1.2"><animate attributeName="opacity" values="0;0.6;0" dur="5.5s" repeatCount="indefinite" begin="0.8s"/></circle>
    <circle cx="820" cy="90" r="1"><animate attributeName="opacity" values="0;0.5;0" dur="6.5s" repeatCount="indefinite" begin="2.1s"/></circle>
  </g>

  <!-- rocky ledge -->
  <path d="M0,320 L0,275 Q120,250 260,270 Q360,285 420,262 Q470,244 540,268 Q640,296 900,272 L900,320 Z" fill="#050608"/>

  <!-- abstract winged silhouette, crouched on the ledge -->
  <g>
    <path d="
      M450,270
      C 440,250 430,236 420,228
      C 380,206 320,204 260,224
      C 300,208 320,182 322,158
      C 340,178 360,190 386,196
      C 384,176 392,158 408,146
      C 414,168 428,182 448,188
      C 452,168 460,152 472,142
      C 478,164 486,182 500,192
      C 512,180 518,164 518,146
      C 534,158 544,176 542,196
      C 566,190 584,178 598,158
      C 602,182 620,206 656,222
      C 600,204 542,206 504,228
      C 492,236 480,250 470,270
      C 464,262 456,262 450,270 Z"
      fill="#050608">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.28;0.42;1" dur="9s" repeatCount="indefinite"/>
    </path>

    <!-- subtle rim light on the silhouette edge -->
    <path d="
      M450,270
      C 440,250 430,236 420,228
      C 380,206 320,204 260,224
      C 300,208 320,182 322,158
      C 340,178 360,190 386,196
      C 384,176 392,158 408,146
      C 414,168 428,182 448,188"
      fill="none" stroke="#ffe9a8" stroke-width="1.4" opacity="0">
      <animate attributeName="opacity" values="0;0;0.35;0.15;0.35" keyTimes="0;0.42;0.5;0.7;1" dur="9s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- faint upward signal beam behind the figure -->
  <polygon points="450,270 400,20 500,20" fill="#ffe9a8" opacity="0">
    <animate attributeName="opacity" values="0;0;0.12;0.12;0" keyTimes="0;0.5;0.6;0.85;1" dur="9s" repeatCount="indefinite"/>
  </polygon>

  <text x="450" y="300" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#c7cbd1" letter-spacing="3" opacity="0">
    A WATCHER IN GOTHAM
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.72;0.8;0.95;1" dur="9s" repeatCount="indefinite"/>
  </text>
</svg>
